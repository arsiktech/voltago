name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline verification
    # GitHub-hosted runner, free for public repositories. Never use a self-hosted
    # runner here: pull requests from forks would run code on it.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      PYTHONPYCACHEPREFIX: /tmp/volta-pycache
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up the pinned npm version
        run: npm install --global npm@12.2.0
      - name: Install locked dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/volta-verify"
          npm ci 2>&1 | tee "$RUNNER_TEMP/volta-verify/npm-root.log"
          npm --prefix frontend ci 2>&1 | tee "$RUNNER_TEMP/volta-verify/npm-frontend.log"
      # Artifact integrity binds the regression receipt to frontend/dist as well as
      # source. Build first, then validate the committed receipt without rewriting it.
      - name: Build the production frontend
        run: npm --prefix frontend run build 2>&1 | tee "$RUNNER_TEMP/volta-verify/build.log"
      - name: Run offline tests, lint, and build
        run: ./scripts/verify.sh --full 2>&1 | tee "$RUNNER_TEMP/volta-verify/verify.log"
      - name: Ensure verification preserves tracked inputs
        run: git diff --exit-code
      - name: Check dependency advisories
        run: |
          npm audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/volta-verify/audit-root.log"
          npm --prefix frontend audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/volta-verify/audit-frontend.log"
      - name: Verify the real map renderer and map-free fallback
        run: |
          npm exec -- playwright install --with-deps chromium
          export VOLTA_QA_CHROME="$(node -p 'require("playwright").chromium.executablePath()')"
          PORT=8773 HOST=127.0.0.1 VOLTA_COMMUNITY_WRITES_ENABLED=false \
            VOLTA_COMMUNITY_DB="$RUNNER_TEMP/volta-verify/community.db" \
            VOLTA_COMMUNITY_PHOTOS="$RUNNER_TEMP/volta-verify/photos" \
            python3 -u server.py > "$RUNNER_TEMP/volta-verify/server.log" 2>&1 &
          qa_server_pid=$!
          trap 'kill "$qa_server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time, urllib.error, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8773/api/health", timeout=2) as response:
                      assert response.status == 200
                  break
              except (OSError, urllib.error.URLError):
                  if attempt == 59:
                      raise
                  time.sleep(0.5)
          PY
          node scripts/qa_maplibre_runtime.js http://127.0.0.1:8773 2>&1 | tee "$RUNNER_TEMP/volta-verify/map-runtime.log"
          node scripts/qa_price_slider.js http://127.0.0.1:8773 2>&1 | tee "$RUNNER_TEMP/volta-verify/price-slider.log"
          node scripts/qa_search_debounce.js http://127.0.0.1:8773 2>&1 | tee "$RUNNER_TEMP/volta-verify/search-debounce.log"
          node scripts/qa_station_details.js http://127.0.0.1:8773 2>&1 | tee "$RUNNER_TEMP/volta-verify/station-details.log"
          node scripts/qa_web_design_audit.js http://127.0.0.1:8773 2>&1 | tee "$RUNNER_TEMP/volta-verify/web-design-audit.log"
      - name: Build and smoke-test the runtime container
        run: |
          docker build --pull --tag volta-ci:${{ github.sha }} . 2>&1 | tee "$RUNNER_TEMP/volta-verify/container-build.log"
          docker run --rm --network none --entrypoint python volta-ci:${{ github.sha }} -c \
            'import datetime, server, sys; from zoneinfo import ZoneInfo; assert sys.version_info[:3] == (3, 14, 8); tz = ZoneInfo("Europe/Madrid"); assert datetime.datetime(2026, 1, 1, tzinfo=tz).utcoffset() == datetime.timedelta(hours=1); assert datetime.datetime(2026, 7, 1, tzinfo=tz).utcoffset() == datetime.timedelta(hours=2); print("Python/import/Madrid timezone checks passed")' \
            2>&1 | tee "$RUNNER_TEMP/volta-verify/container-import.log"
          docker run --detach --name volta-ci --publish 127.0.0.1:18773:8765 volta-ci:${{ github.sha }}
          trap 'docker logs volta-ci > "$RUNNER_TEMP/volta-verify/container-server.log" 2>&1; docker rm --force volta-ci >/dev/null' EXIT
          python3 - <<'PY'
          import json, time, urllib.error, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:18773/api/health", timeout=2) as response:
                      health = json.load(response)
                  break
              except (OSError, urllib.error.URLError):
                  if attempt == 59:
                      raise
                  time.sleep(0.5)
          assert health.get("ok") is True, health
          with urllib.request.urlopen("http://127.0.0.1:18773/", timeout=5) as response:
              assert response.status == 200
              assert 'id="root"' in response.read().decode()
          print("Container HTTP and SPA checks passed")
          PY
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/volta-verify/
          if-no-files-found: warn
          retention-days: 7
