<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f0d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>Volta Go — explore EV charging worldwide</title>
    <meta name="description" content="Search EV charging worldwide. Coverage varies by source and location. Check price, parking and source freshness before you drive. Live availability is shown only where verified." />
    <meta property="og:title" content="Volta Go" />
    <meta property="og:description" content="Search EV charging worldwide. Check coverage and evidence before you drive." />
    <meta property="og:image" content="https://voltago.app/brand/volta-social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Volta Go: find a charger you can trust before you drive." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/volta-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!-- Vite emits the same hashed URL used by the font CSS. Only the primary
         Latin subset is preloaded; other scripts load when their text needs them. -->
    <link rel="preload" href="/node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <!-- Start the default Spain viewport while the app bundle downloads. The href must
         equal the app's first overview request (api.test.ts checks this) or the
         browser fetches it twice. -->
    <link rel="preload" href="/api/chargers?include_leads=true&amp;max_price=5.0&amp;overview=true&amp;bbox=35.8%2C-9.6%2C43.9%2C3.4&amp;compact=true&amp;summary=true" as="fetch" crossorigin="anonymous" />
    <!-- Open the basemap connection early without fetching anything: a failed style
         preload would surface as an app error, while MapLibre handles its own. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin="anonymous" />
    <script>
      // Set theme before paint to avoid a flash.
      (() => {
        try {
          const stored = localStorage.getItem('volta-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = stored ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <!-- First paint before the app bundle arrives: on a slow connection the page was blank
         for seconds (9 s on Slow 3G). The shell mirrors .app-header so nothing jumps when
         React replaces #root's content. Colors repeat the index.css tokens. -->
    <style>
      .boot { position: fixed; inset: 0; background: #f5f6f4; color: #0e1512;
        font-family: 'Manrope Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      [data-theme='dark'] .boot { background: #0b0f0d; color: #edf1ee; }
      .boot-header { display: flex; align-items: center; height: 76px; padding: 0 24px; }
      .boot-brand { display: inline-flex; align-items: center; gap: 10px; font-size: 23px; font-weight: 750; }
      .boot-brand img { width: 36px; height: 36px; }
      .boot-brand .dark { display: none; }
      [data-theme='dark'] .boot-brand .light { display: none; }
      [data-theme='dark'] .boot-brand .dark { display: block; }
      .boot-go { font-weight: 400; }
      .boot-mark { color: #0d7d40; }
      [data-theme='dark'] .boot-mark { color: #21d277; }
      .boot-status { margin: 0; padding: 8px 24px; font-size: 14px; color: #5a6560; }
      [data-theme='dark'] .boot-status { color: #9aa59f; }
      @media (max-width: 767px) {
        .boot-header { height: 60px; padding: 0 16px; }
        .boot-brand { font-size: 21px; }
        .boot-brand img { width: 30px; height: 30px; }
        .boot-status { padding: 8px 16px; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">
      <div class="boot-header">
        <span class="boot-brand"><img class="light" src="/volta-icon-light.svg" alt="" /><img class="dark" src="/volta-icon-dark.svg" alt="" /><span>Volta <span class="boot-go">Go</span><span class="boot-mark">.</span></span></span>
      </div>
      <p class="boot-status" role="status">Loading chargers…</p>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
